<style>
:root{
  --bg:#f0f4fa; --card:#ffffff; --ink:#1a2233; --sub:#6b7a99;
  --primary:#2563eb; --primary-soft:#eaf1ff;
  --cyan:#06b6d4; --green:#10b981; --red:#f43f5e; --amber:#f59e0b;
  --violet:#8b5cf6;
  --border:#e3e9f2; --shadow:0 2px 12px rgba(30,60,120,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1480px;margin:0 auto;padding:20px 24px 60px}

/* header */
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#06b6d4);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px}
h1{font-size:22px;font-weight:700}
.sub{color:var(--sub);font-size:13px}
.spacer{flex:1}
.btn{border:none;cursor:pointer;font-size:13px;padding:9px 18px;border-radius:10px;font-weight:600;transition:.15s}
.btn-import{background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff}
.btn-import:hover{filter:brightness(1.08)}
.badge{background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:600;
  padding:5px 12px;border-radius:999px}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters select{padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;
  font-size:13px;color:var(--ink);cursor:pointer;min-width:120px}
#storeSearch{padding:8px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;width:200px}
.filter-label{font-size:12px;color:var(--sub)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kpi-c,var(--primary))}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .l{font-size:12px;color:var(--sub);margin-top:4px;font-weight:600}
.kpi .s{font-size:11px;color:var(--sub);margin-top:6px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--sub)}

/* charts grid */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:14px}
.panel{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px}
.panel h3{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.chart{width:100%;height:300px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:1000px){.c3,.c4,.c6,.c8{grid-column:span 12}}

/* table */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f5f8fd;color:var(--sub);font-weight:600;padding:9px 8px;text-align:center;
  white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
th:hover{color:var(--primary)}
th .arr{font-size:9px;margin-left:2px}
td{padding:8px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
tr:hover td{background:#f8faff}
.tbl-wrap{overflow:auto;max-height:560px;border-radius:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.tag-gold{background:#fef3c7;color:#b45309}
.tag-silver{background:#e8eaf0;color:#566}
.tag-none{background:#eef1f6;color:#889}
.good{color:var(--green);font-weight:700}
.bad{color:var(--red);font-weight:700}
.store-name{font-weight:700;color:var(--primary)}

/* diag cards */
.diag{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.dcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px}
.dcard .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dcard .dname{font-size:15px;font-weight:800}
.dcard .dtype{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600}
.drow{display:flex;gap:8px;margin-bottom:8px;font-size:12px;line-height:1.55}
.drow .k{flex:0 0 40px;font-weight:700}
.drow .t{flex:1;color:#3a465c}
.drow.good .k{color:var(--green)} .drow.bad .k{color:var(--red)} .drow.plan .k{color:var(--primary)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
.toast.show{opacity:1}
#emptyHint{display:none;text-align:center;color:var(--sub);padding:60px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">花</div>
    <div>
      <h1>美团经营数据看板</h1>
      <div class="sub" id="periodLabel">—</div>
    </div>
    <div class="spacer"></div>
    <span class="badge" id="storeCount">—</span>
    <button class="btn btn-import" onclick="location.href='import.html'">数据导入（多源合并）</button>
  </header>

  <div class="filters">
    <span class="filter-label">筛选</span>
    <select id="fRegion"><option value="">全部大区</option></select>
    <select id="fCity"><option value="">全部城市</option></select>
    <select id="fType"><option value="">全部类型</option></select>
    <input id="storeSearch" placeholder="搜索门店…">
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="panel c6"><h3><span class="dot"></span>GTV 核销金额排名</h3><div class="chart" id="chGtv"></div></div>
    <div class="panel c6"><h3><span class="dot" style="background:var(--cyan)"></span>流量漏斗（合计）</h3><div class="chart" id="chFunnel"></div></div>
    <div class="panel c6"><h3><span class="dot" style="background:var(--green)"></span>双平台星级对比</h3><div class="chart" id="chStar"></div></div>
    <div class="panel c6"><h3><span class="dot" style="background:var(--violet)"></span>推广获客成本 vs 曝访转化</h3><div class="chart" id="chAd"></div></div>
    <div class="panel c6"><h3><span class="dot" style="background:var(--amber)"></span>好评 / 中差评结构</h3><div class="chart" id="chReview"></div></div>
    <div class="panel c6"><h3><span class="dot" style="background:var(--red)"></span>核销率 &amp; 退款率</h3><div class="chart" id="chRate"></div></div>
  </div>

  <div class="panel c12" style="margin-bottom:14px">
    <h3><span class="dot"></span>全门店明细（点击表头排序）</h3>
    <div class="tbl-wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    <div id="emptyHint">没有符合条件的门店</div>
  </div>

  <div class="panel c12">
    <h3><span class="dot" style="background:var(--violet)"></span>逐店诊断（自动生成：长板 / 短板 / 提升点）</h3>
    <div class="diag" id="diag"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const COL = {
  store:'分店名', region:'启然大区', type:'门店类型', province:'省份', city:'城市', level:'牌级',
  score:'经营评分', trade:'交易表现', mtStar:'美团星级', dpStar:'点评星级',
  newCust:'数据部新客数', orderCoup:'下单券数', orderPpl:'下单人数', useCoup:'核销券数', usePpl:'核销人数',
  refundCoup:'退款券数', useRate:'核销率', refundRate:'退款率',
  mtRecv:'美团接待率', recv:'总接待率', gmv:'GMV', gtv:'GTV', adSpend:'推广花费',
  adImp:'推广曝光次数', adVisit:'推广访客次数', cac:'获客成本', adOrders:'推广订单量',
  consult:'双平台总咨询', impPpl:'曝光人数', visitPpl:'访问人数',
  impCv:'曝访转化率', buyCv:'访购率', fav:'新增收藏人数', checkin:'新增打卡人数',
  dpGood:'点评-有效好评', mtGood:'美团-有效好评', goodTotal:'有效好评总数',
  exGood:'优秀好评总数', midBad:'点评-中差评', badTotal:'美团-中差评',
  invite:'好评邀约率', ops:'责任运营', mgr:'运营经理'
};
let RAW = null, view = [], sortKey = COL.gtv, sortAsc = false;
const charts = {};
const F = v => (v == null || v === '' || isNaN(+v)) ? 0 : +v;
const fmtM = v => v >= 10000 ? (v/10000).toFixed(1)+'<small>万</small>' : Math.round(v).toLocaleString();
const pct = v => v == null ? '—' : (v*100).toFixed(1)+'%';
const star = v => (+v > 0) ? (+v).toFixed(1)+'★' : '—';
const $ = id => document.getElementById(id);

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- data loading ---------- */
async function init(){
  try{
    const saved = localStorage.getItem('meituanDashboardData');
    if(saved){ const d = JSON.parse(saved); if(d && d.rows && d.rows.length) RAW = d; }
  }catch(e){}
  if(!RAW){
    try{
      const res = await fetch('data.json');
      if(res.ok){ RAW = await res.json(); }
    }catch(e){}
  }
  if(!RAW || !RAW.rows){
    const emb = document.getElementById('embeddedData');
    if(emb){ try{ RAW = JSON.parse(emb.textContent); }catch(e){} }
  }
  if(!RAW){ RAW = {period:'（点击右上角进入数据导入页）', rows:[]}; }
  buildFilters(); refresh();
}

/* ---------- filters ---------- */
function buildFilters(){
  view = RAW.rows;
  for(const [id, col] of [['fRegion',COL.region],['fCity',COL.city],['fType',COL.type]]){
    const sel = $(id); const old = sel.value;
    const vals = [...new Set(RAW.rows.map(r=>r[col]).filter(v=>v!=null&&v!==''))].sort();
    sel.innerHTML = `<option value="">${sel.options[0].text.split('（')[0]}</option>` +
      vals.map(v=>`<option ${v===old?'selected':''}>${v}</option>`).join('');
  }
  $('storeSearch').value = '';
}
function applyFilters(){
  const rg=$('fRegion').value, ct=$('fCity').value, tp=$('fType').value, kw=$('storeSearch').value.trim();
  view = RAW.rows.filter(r =>
    (!rg || r[COL.region]===rg) && (!ct || r[COL.city]===ct) &&
    (!tp || r[COL.type]===tp) && (!kw || String(r[COL.store]||'').includes(kw)));
  view = view.filter(r => r[COL.store]);
}

/* ---------- main refresh ---------- */
function refresh(){
  applyFilters();
  $('periodLabel').textContent = '数据周期：' + RAW.period + ' · 共 ' + RAW.rows.length + ' 家门店';
  $('storeCount').textContent = '当前展示 ' + view.length + ' 家';
  $('emptyHint').style.display = view.length ? 'none' : 'block';
  renderKpis(); renderCharts(); renderTable(); renderDiag();
  Object.values(charts).forEach(c=>c.resize());
}

function renderKpis(){
  const s = view.reduce((a,r)=>{
    a.gtv+=F(r[COL.gtv]); a.gmv+=F(r[COL.gmv]); a.newC+=F(r[COL.newCust]);
    a.consult+=F(r[COL.consult]); a.good+=F(r[COL.goodTotal]); a.bad+=F(r[COL.badTotal]);
    a.use+=F(r[COL.useCoup]); a.order+=F(r[COL.orderCoup]); a.visit+=F(r[COL.visitPpl]);
    a.imp+=F(r[COL.impPpl]); a.ad+=F(r[COL.adSpend]); a.fav+=F(r[COL.fav]);
    return a;},{gtv:0,gmv:0,newC:0,consult:0,good:0,bad:0,use:0,order:0,visit:0,imp:0,ad:0,fav:0});
  const stars = view.filter(r=>+r[COL.dpStar]>0).map(r=>+r[COL.dpStar]);
  const avgStar = stars.length ? (stars.reduce((a,b)=>a+b,0)/stars.length) : 0;
  const kpi = (v,l,sub,c)=>`<div class="kpi" style="--kpi-c:${c}"><div class="v">${v}</div><div class="l">${l}</div><div class="s">${sub}</div></div>`;
  $('kpis').innerHTML =
    kpi('¥'+fmtM(s.gtv),'核销金额 GTV 合计','GMV ¥'+fmtM(s.gmv),'var(--primary)') +
    kpi('¥'+fmtM(s.ad),'推广花费合计','获客成本 ¥'+(s.newC?Math.round(s.ad/s.newC):0)+' / 新客','var(--cyan)') +
    kpi((s.use+'/'+s.order),'核销 / 下单券数','核销率 '+pct(s.order?s.use/s.order:0),'var(--green)') +
    kpi(s.good,'有效好评合计','中差评 '+s.bad+' · 邀约覆盖可查','var(--amber)') +
    kpi(avgStar.toFixed(1)+'★','点评平均星级','有效门店 '+stars.length+'/'+view.length+' 家','var(--violet)') +
    kpi(s.newC,'新客数合计','双平台咨询 '+s.consult+' 次','var(--red)');
}

function mk(id){ if(charts[id]) return charts[id]; return charts[id]=echarts.init($(id)); }
function setOpt(id, opt){ try{ mk(id).setOption(opt); }catch(e){ console.error('chart '+id+':', e); } }
function renderCharts(){
  const sorted = [...view].sort((a,b)=>F(b[COL.gtv])-F(a[COL.gtv]));
  const names = sorted.map(r=>r[COL.store]);
  const base = {textStyle:{fontFamily:'PingFang SC'},grid:{left:8,right:18,top:26,bottom:8,containLabel:true}};
  const tip = {trigger:'axis',axisPointer:{type:'shadow'},textStyle:{fontSize:12}};

  setOpt('chGtv', {
    ...base, tooltip:{...tip,formatter:p=>'¥'+Number(p[0].value).toLocaleString()},
    xAxis:{type:'value',axisLabel:{fontSize:10,color:'#889'}},
    yAxis:{type:'category',data:names.slice().reverse(),axisLabel:{fontSize:11}},
    series:[{type:'bar',data:sorted.slice().reverse().map(r=>F(r[COL.gtv])),
      itemStyle:{borderRadius:[0,4,4,0],
        color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#2563eb'},{offset:1,color:'#06b6d4'}])},
      label:{show:true,position:'right',fontSize:10,formatter:p=>p.value>=10000?(p.value/10000).toFixed(1)+'万':p.value}}]
  });

  const tot = view.reduce((a,r)=>{a.imp+=F(r[COL.impPpl]);a.vis+=F(r[COL.visitPpl]);
    a.ord+=F(r[COL.orderPpl]);a.use+=F(r[COL.usePpl]);return a;},{imp:0,vis:0,ord:0,use:0});
  setOpt('chFunnel', {
    tooltip:{trigger:'item',textStyle:{fontSize:12}},
    series:[{type:'funnel',left:30,right:30,top:20,bottom:10,minSize:'18%',sort:'descending',gap:3,
      label:{fontSize:12,formatter:'{b}\n{c}'},
      data:[
        {value:tot.imp||1,name:'曝光人数',itemStyle:{color:'#2563eb'}},
        {value:tot.vis||1,name:'访问人数',itemStyle:{color:'#06b6d4'}},
        {value:tot.ord||1,name:'下单人数',itemStyle:{color:'#10b981'}},
        {value:tot.use||1,name:'核销人数',itemStyle:{color:'#f59e0b'}}]}]
  });

  setOpt('chStar', {
    ...base, tooltip:tip, legend:{top:0,textStyle:{fontSize:11}},
    xAxis:{type:'category',data:names.map(n=>n.length>7?n.slice(0,7)+'…':n),axisLabel:{rotate:38,fontSize:10,color:'#667'}},
    yAxis:{type:'value',max:5,min:0},
    series:[
      {name:'美团星级',type:'bar',data:sorted.map(r=>+r[COL.mtStar]||0),itemStyle:{color:'#2563eb',borderRadius:[3,3,0,0]}},
      {name:'点评星级',type:'bar',data:sorted.map(r=>+r[COL.dpStar]||0),itemStyle:{color:'#06b6d4',borderRadius:[3,3,0,0]}}]
  });

  setOpt('chAd', {
    ...base, tooltip:tip, legend:{top:0,textStyle:{fontSize:11}},
    xAxis:{type:'category',data:names.map(n=>n.length>7?n.slice(0,7)+'…':n),axisLabel:{rotate:38,fontSize:10,color:'#667'}},
    yAxis:[{type:'value',name:'获客成本¥'},{type:'value',name:'转化率%',max:100}],
    series:[
      {name:'获客成本',type:'bar',data:sorted.map(r=>F(r[COL.cac])),itemStyle:{color:'#8b5cf6',borderRadius:[3,3,0,0]}},
      {name:'曝访转化率%',type:'line',yAxisIndex:1,smooth:true,symbolSize:6,
       data:sorted.map(r=>(F(r[COL.impCv])*100).toFixed(1)),itemStyle:{color:'#f59e0b'},lineStyle:{width:2.5}}]
  });

  setOpt('chReview', {
    ...base, tooltip:tip, legend:{top:0,textStyle:{fontSize:11}},
    xAxis:{type:'category',data:names.map(n=>n.length>7?n.slice(0,7)+'…':n),axisLabel:{rotate:38,fontSize:10,color:'#667'}},
    yAxis:{type:'value'},
    series:[
      {name:'有效好评',type:'bar',stack:'g',data:sorted.map(r=>F(r[COL.goodTotal])),itemStyle:{color:'#f59e0b',borderRadius:[3,3,0,0]}},
      {name:'优秀好评',type:'bar',stack:'g',data:sorted.map(r=>F(r[COL.exGood])),itemStyle:{color:'#fbbf24'}},
      {name:'中差评',type:'bar',data:sorted.map(r=>F(r[COL.badTotal])),itemStyle:{color:'#f43f5e',borderRadius:[3,3,0,0]}}]
  });

  const rateSorted = [...view];
  setOpt('chRate', {
    ...base, tooltip:{...tip,valueFormatter:v=>(v*100).toFixed(1)+'%'}, legend:{top:0,textStyle:{fontSize:11}},
    xAxis:{type:'category',data:names.map(n=>n.length>7?n.slice(0,7)+'…':n),axisLabel:{rotate:38,fontSize:10,color:'#667'}},
    yAxis:{type:'value',axisLabel:{formatter:v=>v*100+'%'},max:v=>Math.ceil((v.max||0.1)*1.1)},
    series:[
      {name:'核销率',type:'bar',data:rateSorted.map(r=>F(r[COL.useRate])),itemStyle:{color:'#10b981',borderRadius:[3,3,0,0]}},
      {name:'退款率',type:'bar',data:rateSorted.map(r=>F(r[COL.refundRate])),itemStyle:{color:'#f43f5e',borderRadius:[3,3,0,0]}}]
  });
}

/* ---------- table ---------- */
const TCOLS = [
  [COL.store,'门店','store'],
  [COL.level,'牌级','tag'], [COL.score,'经营评分','score'], [COL.trade,'交易表现',null],
  [COL.mtStar,'美团星级','star'], [COL.dpStar,'点评星级','star'],
  [COL.gtv,'GTV','money'], [COL.gmv,'GMV','money'], [COL.adSpend,'推广花费','money'], [COL.cac,'获客成本','money'],
  [COL.newCust,'新客数','num'], [COL.consult,'总咨询','num'],
  [COL.orderCoup,'下单券','num'], [COL.useCoup,'核销券','num'], [COL.refundCoup,'退款券','num'],
  [COL.useRate,'核销率','rate'], [COL.refundRate,'退款率','rate'],
  [COL.goodTotal,'有效好评','num'], [COL.badTotal,'中差评','num'], [COL.invite,'邀约率','rate'],
  [COL.impCv,'曝访转化','rate'], [COL.fav,'新增收藏','num'], [COL.ops,'责任运营',null]
];
function renderTable(){
  const thead = $('tbl').querySelector('thead');
  thead.innerHTML = '<tr>'+TCOLS.map(([c,l])=>{
    const arr = c===sortKey ? (sortAsc?'▲':'▼') : '';
    return `<th onclick="sortBy('${c}')">${l}<span class="arr">${arr}</span></th>`;}).join('')+'</tr>';
  const rows = [...view].sort((a,b)=>{
    const x=a[sortKey], y=b[sortKey];
    if(typeof x==='string'||typeof y==='string') return String(x??'').localeCompare(String(y??''))*(sortAsc?1:-1);
    return (F(x)-F(y))*(sortAsc?1:-1);});
  $('tbl').querySelector('tbody').innerHTML = rows.map(r=>{
    const tds = TCOLS.map(([c,l,kind])=>{
      const v = r[c];
      let html;
      if(kind==='store') html = `<span class="store-name">${v||'—'}</span>`;
      else if(kind==='tag') html = v==='金牌'?'<span class="tag tag-gold">金牌</span>'
        : v==='银牌'?'<span class="tag tag-silver">银牌</span>'
        : v?`<span class="tag tag-none">${v}</span>`:'—';
      else if(kind==='star') html = star(v);
      else if(kind==='money') html = v==null?'—':'¥'+F(v).toLocaleString();
      else if(kind==='num') html = v==null?'—':F(v).toLocaleString();
      else if(kind==='rate') html = pct(v);
      else if(c===COL.score) html = v==null?'—':(F(v)>=95?`<span class="good">${v}</span>`:`<span class="bad">${v}</span>`);
      else if(c===COL.refundRate) html = v==null?'—':(F(v)>0.15?`<span class="bad">${pct(v)}</span>`:pct(v));
      else html = v==null?'—':v;
      return `<td>${html}</td>`;}).join('');
    return '<tr>'+tds+'</tr>';}).join('');
}
function sortBy(c){ if(c===sortKey) sortAsc=!sortAsc; else {sortKey=c; sortAsc=false;} renderTable(); }

/* ---------- auto diagnosis ---------- */
function renderDiag(){
  $('diag').innerHTML = view.map(r=>{
    const g=[],b=[],p=[];
    const gtv=F(r[COL.gtv]), useR=F(r[COL.useRate]), refR=F(r[COL.refundRate]),
          dp=+r[COL.dpStar], mt=+r[COL.mtStar], good=F(r[COL.goodTotal]), bad=F(r[COL.badTotal]),
          cac=F(r[COL.cac]), icv=F(r[COL.impCv]), consult=F(r[COL.consult]), score=F(r[COL.score]);
    if(score>=95) g.push('经营评分 '+score+'，运营质量高');
    if(useR>=0.85) g.push('核销率 '+pct(useR)+'，履约能力强');
    if(dp>=4.5) g.push('点评星级 '+dp.toFixed(1)+'★，口碑达标');
    if(refR<=0.10) g.push('退款率仅 '+pct(refR));
    if(gtv>=10000) g.push('GTV ¥'+(gtv/10000).toFixed(1)+'万，规模靠前');

    if(dp>0 && dp<4.5) b.push('点评星级 '+dp.toFixed(1)+'★，低于4.5目标');
    if(mt>0 && mt<4.7) b.push('美团星级 '+mt.toFixed(1)+'★，有提升空间');
    if(refR>0.15) b.push('退款率 '+pct(refR)+'，高于15%警戒线');
    if(bad>0) b.push('中差评 '+bad+' 条，需源头治理');
    if(consult>0 && useR<0.8) b.push('核销率 '+pct(useR)+'，履约转化偏弱');

    if(b.some(x=>x.includes('星级'))) p.push('优质长图文好评拉升星级至4.5+');
    if(refR>0.15) p.push('排查退款诱因（券范围/话术），压降至15%内');
    if(cac>60) p.push('获客成本 ¥'+cac+'，优化投放结构');
    if(icv>0 && icv<0.08) p.push('曝访转化 '+pct(icv)+'，优化首图与头图信息');
    if(consult===0) p.push('咨询为0，检查店铺在线状态与入口配置');
    if(!p.length && !b.length) p.push('各项达标，保持并输出标杆经验');
    if(!p.length) p.push('聚焦短板专项，两周内逐项验收');
    if(!g.length) g.push('暂无突出长板，优先补基础体验');

    const cls = t => t?'':'';
    const row=(k,t,c)=>`<div class="drow ${c}"><div class="k">${k}</div><div class="t">${t}</div></div>`;
    const lv = r[COL.level]||'无等级';
    const lvCls = lv==='金牌'?'tag-gold':lv==='银牌'?'tag-silver':'tag-none';
    return `<div class="dcard">
      <div class="dhead"><div class="dname">${r[COL.store]||'—'}</div><span class="tag ${lvCls}">${lv} · ${r[COL.city]||''}</span></div>
      ${row('长板', g.join('；')||'—','good')}
      ${row('短板', b.join('；')||'各项基本达标','bad')}
      ${row('提升', p.join('；'),'plan')}
      ${row('责任', (r[COL.ops]||'—')+' / '+(r[COL.mgr]||'—'),'')}
    </div>`;}).join('');
}

/* ---------- events ---------- */
['fRegion','fCity','fType'].forEach(id=>$(id).addEventListener('change',refresh));
$('storeSearch').addEventListener('input',refresh);
window.addEventListener('resize',()=>Object.values(charts).forEach(c=>c.resize()));
init();
</script>
</body>
</html>
